{% extends "base.html" %}
{% block title %}Sign Up — PC Build Recommender{% endblock %}

{% block content %}
<div class="auth-card">
    <h2>Create Account</h2>
    <p class="auth-subtitle">Start building your dream PC today</p>

    <form method="POST" action="{{ url_for('signup') }}">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" placeholder="John Doe" required maxlength="50">
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required maxlength="45">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
    </form>

    <p class="auth-link">
        Already have an account? <a href="{{ url_for('login') }}">Log in here</a>
    </p>
</div>
{% endblock %}
